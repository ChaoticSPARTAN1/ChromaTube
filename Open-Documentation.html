"title":"Start here",
"html":"\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/readme/chromatube-banner.png\" width=\"100%\" alt=\"ChromaTube: video channels on your ModRetro Chromatic. A pixel-art Chromatic handheld showing ChromaTube\u0026#x27;s icon, a stack of three violet video cards, next to the words Your channels via Jellyfin\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  The optional \u003cb\u003eChromaTube\u003c/b\u003e row of the Chromatic's start-up menu: the newest videos of the channels you choose,\n  played through \u003cb\u003eyour own Jellyfin server\u003c/b\u003e.\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cb\u003eRead the guide online:\u003c/b\u003e \u003ca href=\"https://chaoticspartan1.github.io/ChromaTube/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003echaoticspartan1.github.io/ChromaTube\u003c/a\u003e,\n  as a PDF: \u003ca href=\"docs/ChromaTube-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/ChromaTube-Guide.pdf\u003c/a\u003e (opens right on GitHub),\n  or offline: download and double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e.\n\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eChromaTube is an unofficial, independent project, not made, affiliated with or endorsed by YouTube or Google,\nModRetro, Analogue or the Jellyfin project.\u003c/strong\u003e YouTube is a trademark of Google LLC. \"ModRetro\" and \"Chromatic\" are trademarks of ModRetro,\nInc.; \"Analogue\" and \"Pocket\" are trademarks of Analogue; \"Jellyfin\" is a trademark of its owners; they are used here only to say what this project works with.\n\u003cstrong\u003eUse it at your own risk.\u003c/strong\u003e Support is not guaranteed.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-before-you-start-read-this\"\u003eBefore you start: read this\u003c/h2\u003e\n\u003cp\u003eChromaTube's server side uses \u003cstrong\u003eytdlp2STRM\u003c/strong\u003e, a third-party tool built on yt-dlp, to hand your Jellyfin server the\nvideos of the channels you list. \u003cstrong\u003eTools like this conflict with YouTube's Terms of Service\u003c/strong\u003e (they reach videos\noutside YouTube's own apps and player). The Chromatic cannot show YouTube's official player, so there is no\npermitted way to watch on it. Setting this up is \u003cstrong\u003eyour own choice, for private use at home\u003c/strong\u003e; if you are not\ncomfortable with that, do not install it. Everything else on the start-up menu works without it.\nMore: \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003eChromaTube is a separate app with its own row on the start-up menu of\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e. It is built into Jellymatic's start-up menu and is\n\u003cstrong\u003eoff until you switch it on\u003c/strong\u003e (Chromatic Manager › Settings › Apps). This repository holds its guide and the server-side set-up.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eServer tool\u003c/strong\u003e (a small container beside Jellyfin)\u003c/td\u003e\n\u003ctd\u003eytdlp2STRM lists the newest videos (up to 15 each) of the channels in your list, every 6 hours, as tiny \u003ccode\u003e.strm\u003c/code\u003e files in one folder. Nothing is downloaded or kept: a video is fetched only while it plays.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eOne Jellyfin library, \"ChromaTube\"\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eJellyfin shows that folder as a library and converts the video you play into the small picture and sound the Chromatic plays, like any film.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eThe ChromaTube row\u003c/strong\u003e (in Jellymatic's start-up menu)\u003c/td\u003e\n\u003ctd\u003eBrowse channel › videos, press Play. Uses the console's existing Jellyfin sign-in.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePC tools\u003c/strong\u003e (this repository)\u003c/td\u003e\n\u003ctd\u003eAdd, check, refresh, test and remove the one library safely; the Docker template and settings.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/menu-chromatube.png\" width=\"320\" alt=\"The start-up menu with ChromaTube highlighted\"\u003e\n  \u003cimg src=\"docs/images/chromatube-videos.png\" width=\"320\" alt=\"A channel\u0026#x27;s videos (sample data)\"\u003e\n  \u003cimg src=\"docs/images/chromatube-details.png\" width=\"320\" alt=\"A video\u0026#x27;s page with Play (sample data)\"\u003e\n\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAll pictures are drawn by the project's own preview renderers with made-up sample data.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-you-need\"\u003eWhat you need\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA ModRetro Chromatic with Jellymatic's start-up menu \u003cstrong\u003e1.6.5 or newer\u003c/strong\u003e, signed in to your Jellyfin server.\u003c/li\u003e\n\u003cli\u003eA \u003cstrong\u003eJellyfin server\u003c/strong\u003e (10.9 or newer) on your home network, and a machine on that network that runs \u003cstrong\u003eDocker\u003c/strong\u003e\n(often the same NAS or server), with internet access.\u003c/li\u003e\n\u003cli\u003eA folder both the container and Jellyfin can see, \u003cstrong\u003eoutside your existing libraries\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eAn administrator sign-in, \u003cstrong\u003etyped once on the PC\u003c/strong\u003e to add the library; the console keeps its own normal user.\u003c/li\u003e\n\u003cli\u003eA PC with \u003cstrong\u003ePython 3.10+\u003c/strong\u003e for the tools. Details: \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-quick-start-plain-english\"\u003eQuick start (plain English)\u003c/h2\u003e\n\u003cp\u003eEasiest: Chromatic Manager › \u003cstrong\u003eSettings › ChromaTube server\u003c/strong\u003e writes the server files for you, checks the tool answers\nand adds the library (dry run, then Approve); then \u003cstrong\u003eSettings › Apps\u003c/strong\u003e › ChromaTube on. By hand:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eServer tool:\u003c/strong\u003e make your copy of the server files with the required page sign-in\n(\u003ccode\u003epy -3 tools\\make_server_config.py --host \u0026lt;your Docker machine's LAN address\u0026gt; --out \u0026lt;a folder\u0026gt;\u003c/code\u003e), fill in \u003ccode\u003e.env\u003c/code\u003e\nand \u003ccode\u003echannel_list.json\u003c/code\u003e, firewall port 5005 to your Jellyfin server only (your PC only while checking), copy it to your Docker machine and start\nit (\u003ccode\u003edocker compose -p chromatube up -d\u003c/code\u003e). \u003ca href=\"#docs/Server-setup.md\"\u003eServer set-up\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLibrary:\u003c/strong\u003e on your PC, \u003ccode\u003epy -3 tools\\chromatube_library.py add --server-path \u0026lt;the folder as Jellyfin sees it\u0026gt; --ask-admin\u003c/code\u003e (a dry run), then again with \u003ccode\u003e--yes\u003c/code\u003e; then \u003ccode\u003erefresh --yes\u003c/code\u003e and \u003ccode\u003etest\u003c/code\u003e.\n\u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWatch:\u003c/strong\u003e start-up menu › \u003cstrong\u003eChromaTube\u003c/strong\u003e › a channel › a video › \u003cstrong\u003ePlay\u003c/strong\u003e.\n\u003ca href=\"#docs/Using-ChromaTube.md\"\u003eUsing ChromaTube\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-your-server-stays-yours\"\u003eYour server stays yours\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAdd-only:\u003c/strong\u003e one library, on its own folder, with real-time monitoring, internet metadata and picture extraction\noff and no server-wide scan. Every other library is checked byte for byte afterwards.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBackup and dry run first;\u003c/strong\u003e changes only with \u003ccode\u003e--yes\u003c/code\u003e; \u003ccode\u003eremove\u003c/code\u003e deletes only the library it recorded.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe container is boxed in:\u003c/strong\u003e pinned image digest, no privilege escalation, 1 GB memory and 1.5 CPU limits, its\nsettings mounted read-only, only its own folder mounted, nothing of Jellyfin's, \u003cstrong\u003eno YouTube account or cookies\u003c/strong\u003e, no\nJellyfin key.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe firewall is the real protection:\u003c/strong\u003e port 5005 is \u003cstrong\u003efirewalled to your Jellyfin server only\u003c/strong\u003e (your PC only while\nyou check it). The tool's page \u003cstrong\u003erequires a sign-in\u003c/strong\u003e (a random one is made for you), but that sign-in guards only\nits settings pages: in the pinned version its command channel has no sign-in and can start programs inside the\ncontainer, so only the firewall keeps others out (\u003ca href=\"#docs/Security.md:what-the-sign-in-does-not-cover\"\u003eSecurity\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour other devices are never signed out;\u003c/strong\u003e the tools sign out only their own one-run session and print counts,\nnever addresses or names. Full set-up: \u003ca href=\"#docs/Security.md\"\u003eSecurity\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-undo-everything\"\u003eUndo everything\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py remove --yes\u003c/code\u003e removes exactly the library it added (your files are not touched);\n\u003ccode\u003edocker compose -p chromatube down -v\u003c/code\u003e stops and deletes the container and its data; delete the ChromaTube folder.\nSwitch the row off in Chromatic Manager (Settings › Apps) or hide it on the console (Select on the row).\n\u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-documentation-wiki\"\u003eDocumentation (wiki)\u003c/h2\u003e\n\u003cp\u003eStart at \u003cstrong\u003e\u003ca href=\"#docs/Home.md\"\u003edocs/Home.md\u003c/a\u003e\u003c/strong\u003e. Pages: What you need · Before you start · Server set-up · Add the library ·\nUsing ChromaTube · Updating · Security · Undo everything · Troubleshooting · FAQ · Building and testing · Credits \u0026amp;\nlicences. \u003cstrong\u003eAs one PDF:\u003c/strong\u003e \u003ca href=\"docs/ChromaTube-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/ChromaTube-Guide.pdf\u003c/a\u003e. \u003cstrong\u003eOffline:\u003c/strong\u003e double-click\n\u003cstrong\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e\u003c/strong\u003e (keep it next to \u003ccode\u003edocs/\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-this-repository\"\u003eWhat is in this repository\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003eserver/                 docker-compose.yml (pinned digest, limits, read-only settings), .env.example, config.example.json\n                        and the tool's other settings templates\ntools/                  PC tools: chromatube_library.py, make_server_config.py, jellyfin_admin.py, tests/\nart/                    the row's icon (original pixel art, the same pixels as the console's)\ndocs/                   the guide (Markdown), pictures, fonts, GitHub Pages copy, PDF guide\nscripts/                documentation builders and their test\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eNot in this repository:\u003c/strong\u003e ytdlp2STRM, yt-dlp or any video (Docker downloads the pinned image from Docker Hub), any\nchannel list of anyone's, and the console code: the ChromaTube row is part of Jellymatic's start-up menu\n(\u003ccode\u003echromatic/jellyfin/\u003c/code\u003e, \u003ccode\u003echromatic/launcher/\u003c/code\u003e in \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e). Your\nown files (backups, the library record) live in \u003ccode\u003e%LOCALAPPDATA%\\ChromaTube\u003c/code\u003e and never in Git.\u003c/p\u003e\n\u003ch2 id=\"h-sibling-projects\"\u003eSibling projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: the Chromatic start-up menu, Jellyfin app and Chromatic Manager (ChromaTube runs inside it).\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e: the TV row, with Local Weather and optional Live TV.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e: Jellyfin on the Analogue Pocket.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: see and press the console's menus from your PC.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003eChromaTube is free software: \u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms under GPLv3 section 7\n(\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e): keep the author attribution \"ChaoticSPARTAN1\" (7(b)) and mark modified\nversions as modified (7(c)). ytdlp2STRM (MIT) and yt-dlp (The Unlicense) are not included; see\n\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e and \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-contributing-and-security\"\u003eContributing and security\u003c/h2\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome: \u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e. To report a security problem\nprivately: \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Never post server addresses, tokens, your channel list or logs with addresses.\u003c/p\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. The server side uses \u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eytdlp2STRM\u003c/a\u003e by fe80grau\n(MIT), which uses \u003ca href=\"https://github.com/yt-dlp/yt-dlp\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eyt-dlp\u003c/a\u003e (The Unlicense). Playback by your\n\u003ca href=\"https://jellyfin.org\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellyfin\u003c/a\u003e server. Full list: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e"
},

"path":"docs/Home.md",
"title":"Wiki home",
"html":"\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-icon.png\" width=\"120\" alt=\"ChromaTube\u0026#x27;s icon: a stack of three violet video cards\"\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-logo.png\" width=\"324\" alt=\"ChromaTube\"\u003e\u003c/p\u003e\n\u003ch1 id=\"h-chromatube-wiki\"\u003eChromaTube wiki\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eVideo channels on your ModRetro Chromatic\u003c/strong\u003e, played through your own Jellyfin server. Optional, and off until you\nset it up.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRead it as one PDF:\u003c/strong\u003e \u003ca href=\"docs/ChromaTube-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube-Guide.pdf\u003c/a\u003e (opens right on GitHub). \u003cstrong\u003eOr offline:\u003c/strong\u003e\ndownload or clone the repository, then double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in its main folder.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eChromaTube is an unofficial, independent project, not affiliated with or endorsed by YouTube or Google, ModRetro,\nAnalogue or the Jellyfin project. YouTube is a trademark of Google LLC. Use it at your own risk; support is not guaranteed.\n\u003cstrong\u003eRead \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e first.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-contents\"\u003eContents\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eRead it when\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBefore anything else\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAlways: the terms question, what it costs your server, what others can see\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Server-setup.md\"\u003eServer set-up\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou start the small server tool\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou add the one ChromaTube library to Jellyfin\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Using-ChromaTube.md\"\u003eUsing ChromaTube\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eButtons and what the screens say\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eVideos stop playing, or you change channels\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Security.md\"\u003eSecurity\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want the server side locked down properly\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want it all gone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSomething does not work\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eShort answers\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Building-and-testing.md\"\u003eBuilding and testing\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou change the tools or the docs\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWho made what, and under which licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-in-one-picture\"\u003eIn one picture\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003e your channel list ──► ytdlp2STRM container ──► one folder of tiny .strm files ──► Jellyfin library \"ChromaTube\"\n (on the Docker machine)   every 6 hours           (nothing is downloaded)            converts the one video you play\n                                                                                                 │ Wi-Fi\n Start-up menu ──► ChromaTube ──► channel ──► video ──► Play ◄───────────────────────────────────┘\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/menu-chromatube.png\" width=\"320\" alt=\"The start-up menu with ChromaTube highlighted\"\u003e\n\u003cimg src=\"docs/images/chromatube-root.png\" width=\"320\" alt=\"ChromaTube: the channels (sample data)\"\u003e\u003c/p\u003e"

"path":"docs/What-you-need.md",
"title":"What you need",
"html":"\u003ch1 id=\"h-what-you-need\"\u003eWhat you need\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › What you need\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e with Jellymatic's start-up menu \u003cstrong\u003e1.6.5 or newer\u003c/strong\u003e, signed in to your Jellyfin server\u003c/td\u003e\n\u003ctd\u003eThe ChromaTube row is part of it and uses the console's own Jellyfin sign-in\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://chaoticspartan1.github.io/Jellymatic/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic guide\u003c/a\u003e. Sound needs Jellymatic's console chip image 18.40 or 18.41.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eJellyfin server 10.9 or newer\u003c/strong\u003e on your \u003cstrong\u003ehome network\u003c/strong\u003e, with video conversion working\u003c/td\u003e\n\u003ctd\u003eIt converts the video you play into the console's small format\u003c/td\u003e\n\u003ctd\u003eDashboard › Playback › Transcoding; keep it off the internet.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA machine on the same network that runs \u003cstrong\u003eDocker\u003c/strong\u003e (with Compose), with internet access\u003c/td\u003e\n\u003ctd\u003eRuns the small ytdlp2STRM container\u003c/td\u003e\n\u003ctd\u003eOften the NAS or server that runs Jellyfin. A NAS \"Docker\" or \"Container\" app works: paste the compose file as a project.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003efolder\u003c/strong\u003e that both the container and Jellyfin can see, \u003cstrong\u003eoutside every existing library folder\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe container writes the video list there; Jellyfin reads it as the ChromaTube library\u003c/td\u003e\n\u003ctd\u003eIf Jellyfin runs in Docker, its configuration folder (seen as \u003ccode\u003e/config\u003c/code\u003e) is often the easiest place: \u003ccode\u003e\u0026lt;config\u0026gt;/ChromaTube\u003c/code\u003e. A brand-new mount into the Jellyfin container would need that container to be re-created (a restart): your decision.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn \u003cstrong\u003eadministrator\u003c/strong\u003e name and password, \u003cstrong\u003etyped once on the PC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOnly an administrator may add a library\u003c/td\u003e\n\u003ctd\u003eThe tools ask with \u003ccode\u003e--ask-admin\u003c/code\u003e, keep it in memory for that run and sign that run out.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe console's \u003cstrong\u003enormal user\u003c/strong\u003e may see the ChromaTube library\u003c/td\u003e\n\u003ctd\u003eThe console plays as that user\u003c/td\u003e\n\u003ctd\u003eDashboard › Users › that user › Library access.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003ePC\u003c/strong\u003e with \u003cstrong\u003ePython 3.10 or newer\u003c/strong\u003e on the same network\u003c/td\u003e\n\u003ctd\u003eRuns \u003ccode\u003etools/make_server_config.py\u003c/code\u003e and \u003ccode\u003etools/chromatube_library.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eStandard library only.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003efirewall\u003c/strong\u003e on the Docker machine you can set\u003c/td\u003e\n\u003ctd\u003ePort 5005 must be reachable only from your Jellyfin server (and your PC only while you check it): the firewall is the real protection\u003c/td\u003e\n\u003ctd\u003eRequired: \u003ca href=\"#docs/Server-setup.md:4-close-port-5005-to-everyone-else\"\u003eServer set-up\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-not-needed\"\u003eNot needed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNo YouTube or Google account, no cookies, no API key.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eNo Jellyfin plugin and no Jellyfin restart (if the folder is already visible to Jellyfin).\u003c/li\u003e\n\u003cli\u003eNo PC running while you watch.\u003c/li\u003e\n\u003cli\u003eNo disk space for videos: only tiny \u003ccode\u003e.strm\u003c/code\u003e files are written.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Before-you-start.md",
"title":"Before you start",
"html":"\u003ch1 id=\"h-before-you-start\"\u003eBefore you start\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Before you start\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Before-you-start.md:youtubes-terms\"\u003eYouTube's terms\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:how-it-works\"\u003eHow it works\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:what-it-costs-your-server\"\u003eWhat it costs your server\u003c/a\u003e ·\n\u003ca href=\"#docs/Before-you-start.md:who-can-see-what\"\u003eWho can see what\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:what-it-does-not-do\"\u003eWhat it does not do\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-youtubes-terms\"\u003eYouTube's terms\u003c/h2\u003e\n\u003cp\u003eChromaTube's server side uses \u003cstrong\u003eytdlp2STRM\u003c/strong\u003e, which uses \u003cstrong\u003eyt-dlp\u003c/strong\u003e to find each video's address and hand it to your\nJellyfin server. \u003cstrong\u003eThis conflicts with YouTube's Terms of Service\u003c/strong\u003e: it reaches videos outside YouTube's own apps and\nembedded player. The Chromatic cannot show YouTube's official player (it has no web browser and a 160 × 144 screen),\nso there is no permitted way to watch YouTube on it.\u003c/p\u003e\n\u003cp\u003eSetting ChromaTube up is therefore \u003cstrong\u003eyour own choice, for private viewing at home\u003c/strong\u003e, with the channels you choose.\nChromaTube itself contains no YouTube code and no video; it gives you a configuration for a third-party tool and\nthe safe Jellyfin set-up around it. YouTube Premium does not change this. In practice YouTube breaks such tools from\ntime to time; then videos stop starting until a newer image of the tool is out (\u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eChromaTube does not and \u003cstrong\u003emust not\u003c/strong\u003e be used to get around paid, members-only, rented or DRM-protected videos: it is\nmade for public videos only, and it uses no account and no cookies, so such videos do not play.\u003c/p\u003e\n\u003cp\u003eIf you are not comfortable with this, \u003cstrong\u003edo not install it\u003c/strong\u003e: Games, Jellyfin and TV work without it, and the\nChromaTube row stays off.\u003c/p\u003e\n\u003ch2 id=\"h-how-it-works\"\u003eHow it works\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eYou list channels in \u003ccode\u003echannel_list.json\u003c/code\u003e on the Docker machine.\u003c/li\u003e\n\u003cli\u003eEvery 6 hours the ytdlp2STRM container lists the newest videos of each channel (at most 15, from the last 30\ndays) as tiny \u003ccode\u003e.strm\u003c/code\u003e files, one folder per channel, in the ChromaTube folder. \u003cstrong\u003eNothing is downloaded.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eJellyfin shows that folder as the library \"ChromaTube\" (channels as shows, years as seasons).\u003c/li\u003e\n\u003cli\u003eWhen you press Play on the console, Jellyfin asks the container for that one video (a 360p source), converts it\ninto the console's small MJPEG picture and ADPCM sound, and streams it over your Wi-Fi.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-what-it-costs-your-server\"\u003eWhat it costs your server\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDisk:\u003c/strong\u003e a few KB per video listed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCPU:\u003c/strong\u003e one software conversion while you watch, from a 360p source (light), like a film in Jellyfin.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNetwork:\u003c/strong\u003e each played video is streamed from the internet to your server once, while it plays.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMemory and CPU of the container\u003c/strong\u003e are capped (1 GB, 1.5 CPU); it is idle between list updates.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-who-can-see-what\"\u003eWho can see what\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eThe library shows in your other Jellyfin apps too\u003c/strong\u003e (TV, phone), for every user allowed to see it, like any\nlibrary. Hide it from a user in Dashboard › Users › that user › Library access (your choice; the tools never change\nusers).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGoogle/YouTube sees\u003c/strong\u003e your home internet address fetching channel lists and the videos you play, with no account\nand no cookies.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJellyfin keeps\u003c/strong\u003e resume points and watched marks for ChromaTube videos, as for any item.\u003c/li\u003e\n\u003cli\u003eThe tools print counts only; your channel list stays on your Docker machine.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-it-does-not-do\"\u003eWhat it does not do\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNo sign-in to YouTube or Google, no cookies, no API key, no comments, likes or subscriptions.\u003c/li\u003e\n\u003cli\u003eNo search of all of YouTube: only the channels you list.\u003c/li\u003e\n\u003cli\u003eNo downloads, no copies kept, no age-restricted videos (they need cookies: never add any).\u003c/li\u003e\n\u003cli\u003eNo seeking or resume on the console (one stream from the start; see \u003ca href=\"#docs/Using-ChromaTube.md\"\u003eUsing ChromaTube\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Server-setup.md\"\u003eServer set-up\u003c/a\u003e\u003c/p\u003e"
}
]
},

{
"path":"docs/Server-setup.md",
"title":"Server set-up",
"html":"\u003ch1 id=\"h-server-set-up\"\u003eServer set-up\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Server set-up\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Server-setup.md:1-choose-the-folder\"\u003e1. Choose the folder\u003c/a\u003e · \u003ca href=\"#docs/Server-setup.md:2-make-your-copy-of-the-files\"\u003e2. Make your copy of the files\u003c/a\u003e ·\n\u003ca href=\"#docs/Server-setup.md:3-your-channels\"\u003e3. Your channels\u003c/a\u003e · \u003ca href=\"#docs/Server-setup.md:4-close-port-5005-to-everyone-else\"\u003e4. Close port 5005 to everyone else\u003c/a\u003e ·\n\u003ca href=\"#docs/Server-setup.md:5-start-it\"\u003e5. Start it\u003c/a\u003e · \u003ca href=\"#docs/Server-setup.md:6-check-it\"\u003e6. Check it\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe easy way: Chromatic Manager.\u003c/strong\u003e \u003cstrong\u003eSettings › ChromaTube server\u003c/strong\u003e (text menu \u003ccode\u003ey\u003c/code\u003e; tick \"I understand\" first):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eFill in your Docker machine's home-network address, a \u003cstrong\u003emedia folder\u003c/strong\u003e on that machine that your Jellyfin container\ncan already see (but \u003cstrong\u003enot\u003c/strong\u003e inside one of your library folders: then Jellyfin needs no restart and no new mount),\nthe folder where you keep the settings files, and your channels (one a line, like \u003ccode\u003ehttps://www.youtube.com/@name\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave files...\u003c/strong\u003e writes \u003ccode\u003edocker-compose.yml\u003c/code\u003e and four settings files into a folder you choose on your PC.\n\u003ccode\u003econfig.json\u003c/code\u003e gets the tool's \u003cstrong\u003epage sign-in\u003c/strong\u003e, which is \u003cstrong\u003erequired\u003c/strong\u003e: a random user name and password that Chromatic\nManager makes for you. It is stored only in \u003ccode\u003econfig.json\u003c/code\u003e and in a private copy on your PC (Chromatic Manager's file\n\u003ccode\u003echromatube-server-signin.json\u003c/code\u003e); the window never shows it (open either file if you need to read it). Saving again\nkeeps the same sign-in. Never share \u003ccode\u003econfig.json\u003c/code\u003e or put it in Git. Copy the five files to the settings folder on the\nDocker machine.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRequired:\u003c/strong\u003e on the Docker machine's firewall, allow port \u003cstrong\u003e5005\u003c/strong\u003e only from your Jellyfin server; allow your PC\nonly while you run \u003cstrong\u003eCheck it answers\u003c/strong\u003e or open the tool's page, then remove that rule. Never forward 5005 on your\nrouter. The firewall is the real protection: the sign-in guards only the settings pages\n(\u003ca href=\"#docs/Security.md:what-the-sign-in-does-not-cover\"\u003eSecurity\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eIn your Docker app, create a project named \u003ccode\u003echromatube\u003c/code\u003e from \u003ccode\u003edocker-compose.yml\u003c/code\u003e (or run\n\u003ccode\u003edocker compose -p chromatube up -d\u003c/code\u003e in that folder). The Manager never runs Docker for you.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCheck it answers\u003c/strong\u003e: it passes only when the tool's page \u003cstrong\u003erefuses\u003c/strong\u003e a visitor without the sign-in and \u003cstrong\u003eanswers\u003c/strong\u003e\nwith it (the private copy on your PC). If it says the tool answers without a sign-in, copy the saved \u003ccode\u003econfig.json\u003c/code\u003e to\nthe Docker machine again and restart the project.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThen add the library on the same page (\u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e). The Manager writes the same safety\nsettings as \u003ccode\u003eserver/\u003c/code\u003e here (pinned digest, no privilege escalation, settings mounted read-only, no cookies, no Jellyfin\nkey) and never runs Docker for you.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-chromatube-server.png\" width=\"600\" alt=\"Chromatic Manager: ChromaTube server (private fields masked)\"\u003e\n\u003cimg src=\"docs/images/manager-chromatube-saved.png\" width=\"600\" alt=\"After Save files: where the sign-in is kept (it is never shown)\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBy hand:\u003c/strong\u003e the steps below. The server tool is a small Docker container (ytdlp2STRM) beside your Jellyfin server.\nYou start it yourself: neither the tools here nor Chromatic Manager ever control your Docker.\u003c/p\u003e\n\u003ch2 id=\"h-1-choose-the-folder\"\u003e1. Choose the folder\u003c/h2\u003e\n\u003cp\u003ePick \u003cstrong\u003eone\u003c/strong\u003e folder for the video list that:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethe Docker machine can write to, and\u003c/li\u003e\n\u003cli\u003eyour \u003cstrong\u003eJellyfin server can already see\u003c/strong\u003e, and\u003c/li\u003e\n\u003cli\u003elies \u003cstrong\u003eoutside every existing library folder\u003c/strong\u003e (otherwise another library would scan it).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNote two paths: where it is \u003cstrong\u003eon the Docker machine\u003c/strong\u003e (for \u003ccode\u003e.env\u003c/code\u003e) and where \u003cstrong\u003eJellyfin\u003c/strong\u003e sees it (for the library,\nfor example \u003ccode\u003e/config/ChromaTube\u003c/code\u003e when Jellyfin runs in Docker with its configuration folder mounted at \u003ccode\u003e/config\u003c/code\u003e).\nIf Jellyfin cannot see any such folder yet, adding a new mount to the Jellyfin container means re-creating it (a\nrestart): decide that yourself; ChromaTube never does it.\u003c/p\u003e\n\u003ch2 id=\"h-2-make-your-copy-of-the-files\"\u003e2. Make your copy of the files\u003c/h2\u003e\n\u003cp\u003eNever fill in the files inside the cloned repository: \u003ccode\u003econfig.json\u003c/code\u003e will hold a password. Make your own copy,\n\u003cstrong\u003ewith the tool's page sign-in set. The sign-in is required\u003c/strong\u003e: the tool's page can change its settings, so without a\nsign-in anyone on your home network who can reach port 5005 could do that. The sign-in guards only the settings\npages, not the tool's command channel: the firewall rule in step 4 is the real protection.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\make_server_config.py --host 192.168.1.20 --out D:\\chromatube\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003e--host\u003c/code\u003e is the Docker machine's \u003cstrong\u003eLAN address\u003c/strong\u003e (the address Jellyfin uses to reach it; never \u003ccode\u003e0.0.0.0\u003c/code\u003e, never a\npublic address). It copies the files of \u003ccode\u003eserver/\u003c/code\u003e into the new folder and writes \u003ccode\u003econfig.json\u003c/code\u003e with that address and a\n\u003cstrong\u003erandom user name and long random password\u003c/strong\u003e for the page (open \u003ccode\u003econfig.json\u003c/code\u003e to read them; they are never printed).\nOn macOS/Linux the files are readable by you only (if the tool later cannot read its settings, check the file's owner\nand permissions on the Docker machine). Copy that folder to the Docker machine (for example as\n\u003ccode\u003echromatube/\u003c/code\u003e), then:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFile\u003c/th\u003e\n\u003cth\u003eWhat to do\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e.env.example\u003c/code\u003e → \u003ccode\u003e.env\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSet \u003ccode\u003eCHROMATUBE_LIST_FOLDER\u003c/code\u003e to the folder from step 1, as the Docker machine sees it\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003econfig.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAlready filled in. By hand instead: copy \u003ccode\u003econfig.example.json\u003c/code\u003e to \u003ccode\u003econfig.json\u003c/code\u003e and replace \u003cstrong\u003eevery\u003c/strong\u003e \u003ccode\u003eCHANGE-ME\u003c/code\u003e: the LAN address, a user name and a long random password of your own. Never leave the sign-in empty; never commit or share this file\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003echannel_list.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eYour channels (step 3)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eyt_config.json\u003c/code\u003e, \u003ccode\u003ecrons.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLeave as they are: 360p sources, at most 15 videos a channel from the last 30 days, a new list every 6 hours, \u003cstrong\u003eno cookies\u003c/strong\u003e, no Jellyfin key\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edocker-compose.yml\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLeave as it is: the image is pinned by digest, no privilege escalation, limits set, and the four settings files \u003cstrong\u003emounted read-only\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eRead-only settings:\u003c/strong\u003e the container cannot change its own settings files, so the page cannot change its sign-in or\nyour channels. To change anything, edit the file on the Docker machine, then restart:\n\u003ccode\u003edocker compose -p chromatube restart\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-3-your-channels\"\u003e3. Your channels\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003echannel_list.json\u003c/code\u003e is a list of channel addresses, one per line, for example:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[\n    \"https://www.youtube.com/@SomeChannel\",\n    \"https://www.youtube.com/channel/UCxxxxxxxxxxxxxxxxxxxxxx\"\n]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKeep it short (a handful of channels is plenty on a handheld). The list stays on your Docker machine.\u003c/p\u003e\n\u003ch2 id=\"h-4-close-port-5005-to-everyone-else\"\u003e4. Close port 5005 to everyone else\u003c/h2\u003e\n\u003cp\u003eThis step is \u003cstrong\u003erequired\u003c/strong\u003e, not optional:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNo port forward\u003c/strong\u003e for 5005 on your router.\u003c/li\u003e\n\u003cli\u003eOn the Docker machine's firewall, allow port 5005 \u003cstrong\u003eonly from your Jellyfin server\u003c/strong\u003e; block it for every other\ndevice. Allow your PC only while you run \u003cstrong\u003eCheck it answers\u003c/strong\u003e or open the tool's page, then remove that rule.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThis rule is the real protection.\u003c/strong\u003e In the pinned version the page sign-in protects the settings pages only: the\ntool's live command channel has no sign-in, accepts connections from any web page and can start programs inside the\ncontainer, so anything that can reach port 5005 (including a web page open in a browser on an allowed computer)\ncould use it. The video addresses Jellyfin uses (\u003ccode\u003e/youtube/...\u003c/code\u003e) need no sign-in either.\u003c/li\u003e\n\u003cli\u003eDetails: \u003ca href=\"#docs/Security.md:what-the-sign-in-does-not-cover\"\u003eSecurity\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-5-start-it\"\u003e5. Start it\u003c/h2\u003e\n\u003cp\u003eIn the folder with \u003ccode\u003edocker-compose.yml\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edocker compose -p chromatube up -d\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOr, in a NAS Docker app: new project, name \u003ccode\u003echromatube\u003c/code\u003e, paste \u003ccode\u003edocker-compose.yml\u003c/code\u003e, put the other files in the\nproject folder, start it. The container is called \u003ccode\u003echromatube-ytdlp2strm\u003c/code\u003e. Its page answers at\n\u003ccode\u003ehttp://\u0026lt;the address in config.json\u0026gt;:5005\u003c/code\u003e and asks for the user name and password from \u003ccode\u003econfig.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eWhy \"host\" networking: this version of the tool listens only on the address written in \u003ccode\u003econfig.json\u003c/code\u003e, and with\nDocker's default bridge network its page cannot be reached. Because it binds to that one LAN address, it is not\nlistening on other interfaces of the machine.\u003c/p\u003e\n\u003cp\u003eIf the container does not start with the hardening settings (read-only settings, no privilege escalation), look at\nits log (\u003ccode\u003edocker logs chromatube-ytdlp2strm\u003c/code\u003e) and report it (\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e); do not remove the\nsign-in or open the port to work around it. If the log says it cannot read \u003ccode\u003econfig.json\u003c/code\u003e, check that file's owner and\npermissions on the Docker machine.\u003c/p\u003e\n\u003ch2 id=\"h-6-check-it\"\u003e6. Check it\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOpen its page from your PC (with the temporary firewall rule for your PC): it asks for the sign-in, then lists your\nchannels and its next run. Remove the PC's rule again when you are done.\u003c/li\u003e\n\u003cli\u003eAfter the first run (start it from its page, or wait up to 6 hours), the ChromaTube folder holds one folder per\nchannel with \u003ccode\u003e.strm\u003c/code\u003e files.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Add-the-library.md",
"title":"Add the library",
"html":"\u003ch1 id=\"h-add-the-library\"\u003eAdd the library\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Add the library\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Add-the-library.md:get-the-tools\"\u003eGet the tools\u003c/a\u003e · \u003ca href=\"#docs/Add-the-library.md:1-check\"\u003e1. Check\u003c/a\u003e · \u003ca href=\"#docs/Add-the-library.md:2-add-dry-run-then-for-real\"\u003e2. Add (dry run, then for real)\u003c/a\u003e ·\n\u003ca href=\"#docs/Add-the-library.md:3-refresh\"\u003e3. Refresh\u003c/a\u003e · \u003ca href=\"#docs/Add-the-library.md:4-test\"\u003e4. Test\u003c/a\u003e · \u003ca href=\"#docs/Add-the-library.md:5-let-the-console-see-it\"\u003e5. Let the console see it\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eThe console's ChromaTube row looks for \u003cstrong\u003eone library named exactly \"ChromaTube\"\u003c/strong\u003e. \u003ccode\u003etools/chromatube_library.py\u003c/code\u003e\nadds it safely: add-only, with a backup, a dry run and proof that nothing else changed\n(\u003ca href=\"#docs/Security.md\"\u003eSecurity\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-get-the-tools\"\u003eGet the tools\u003c/h2\u003e\n\u003cp\u003eInstall \u003cstrong\u003ePython 3.10+\u003c/strong\u003e, download this repository and open a terminal in its folder (\u003ccode\u003epy -3\u003c/code\u003e on Windows,\n\u003ccode\u003epython3\u003c/code\u003e elsewhere). \u003ccode\u003e--ask-admin\u003c/code\u003e asks for an administrator's name and password for that one run, keeps them in\nmemory only and signs that run's own session out at the end; nothing is saved and no other device is signed out.\u003c/p\u003e\n\u003ch2 id=\"h-1-check\"\u003e1. Check\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py check --server-path /config/ChromaTube --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRead-only. It checks the server version, that the server \u003cstrong\u003esees\u003c/strong\u003e the folder (and how many channel folders are in\nit), that the folder is \u003cstrong\u003eoutside every existing library folder\u003c/strong\u003e, and that no library is called ChromaTube yet.\u003c/p\u003e\n\u003ch2 id=\"h-2-add-dry-run-then-for-real\"\u003e2. Add (dry run, then for real)\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py add --server-path /config/ChromaTube --ask-admin\npy -3 tools\\chromatube_library.py add --server-path /config/ChromaTube --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe first only shows what it would do. The second saves a backup of the library list and a fingerprint of users,\ndevices, plugins, tasks and conversion settings, then adds \u003cstrong\u003eone\u003c/strong\u003e library:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003cth\u003eValue\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eName\u003c/td\u003e\n\u003ctd\u003eChromaTube\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eType\u003c/td\u003e\n\u003ctd\u003eShows (channels as shows, years as seasons)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFolder\u003c/td\u003e\n\u003ctd\u003ethe one you gave\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eReal-time monitoring, internet metadata, chapter pictures, trickplay pictures\u003c/td\u003e\n\u003ctd\u003eoff\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eScan\u003c/td\u003e\n\u003ctd\u003enone server-wide: the next step scans only this library\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThen it proves every other library is byte for byte unchanged and records the library's name, id and folder in your\nprivate folder (\u003ccode\u003e%LOCALAPPDATA%\\ChromaTube\u003c/code\u003e), so \u003ccode\u003eremove\u003c/code\u003e can later delete exactly it.\u003c/p\u003e\n\u003ch2 id=\"h-3-refresh\"\u003e3. Refresh\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py refresh --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eScans \u003cstrong\u003eonly\u003c/strong\u003e the ChromaTube library and reports how many channels it holds. Afterwards Jellyfin's own scheduled\nlibrary scan picks up new videos; run \u003ccode\u003erefresh\u003c/code\u003e again whenever you do not want to wait.\u003c/p\u003e\n\u003ch2 id=\"h-4-test\"\u003e4. Test\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py test\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePlays the newest video for 12 seconds exactly the way the console does (it asks Jellyfin's PlaybackInfo first, then\nthe small MJPEG + ADPCM stream), reports the first-picture time and format as numbers, and stops its own conversion.\n\u003ccode\u003ePASS a ChromaTube video plays through Jellyfin in the Chromatic format\u003c/code\u003e means the console will play it too.\u003c/p\u003e\n\u003ch2 id=\"h-5-let-the-console-see-it\"\u003e5. Let the console see it\u003c/h2\u003e\n\u003cp\u003eThe console plays as its own Jellyfin user. If that user has access to only some libraries, add ChromaTube:\n\u003cstrong\u003eDashboard › Users › the console's user › Library access\u003c/strong\u003e. Then: start-up menu › \u003cstrong\u003eChromaTube\u003c/strong\u003e\n(\u003ca href=\"#docs/Using-ChromaTube.md\"\u003eUsing ChromaTube\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSwitch the row on:\u003c/strong\u003e ChromaTube is off on a new console. Chromatic Manager › \u003cstrong\u003eSettings › Apps\u003c/strong\u003e › ChromaTube on,\n\u003cstrong\u003eSave and write to console\u003c/strong\u003e, \u003cstrong\u003eApprove\u003c/strong\u003e (or, if you hid it on the console: Other firmware › Show hidden apps).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWith Chromatic Manager instead of this tool:\u003c/strong\u003e \u003cstrong\u003eSettings › ChromaTube server\u003c/strong\u003e › \u003cstrong\u003eFind it\u003c/strong\u003e, \u003cstrong\u003eDry run\u003c/strong\u003e, \u003cstrong\u003eAdd\nlibrary\u003c/strong\u003e. Both add the same library with the same options and record it with the same keys, so either one's remove\nworks on it.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Using-ChromaTube.md\"\u003eUsing ChromaTube\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Using-ChromaTube.md",
"title":"Using ChromaTube",
"html":"\u003ch1 id=\"h-using-chromatube\"\u003eUsing ChromaTube\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Using ChromaTube\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Using-ChromaTube.md:browsing\"\u003eBrowsing\u003c/a\u003e · \u003ca href=\"#docs/Using-ChromaTube.md:playing\"\u003ePlaying\u003c/a\u003e · \u003ca href=\"#docs/Using-ChromaTube.md:what-the-screen-says\"\u003eWhat the screen says\u003c/a\u003e · \u003ca href=\"#docs/Using-ChromaTube.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-browsing\"\u003eBrowsing\u003c/h2\u003e\n\u003cp\u003eSwitch it on first (Chromatic Manager › Settings › Apps). Start-up menu › \u003cstrong\u003eChromaTube\u003c/strong\u003e › \u003cstrong\u003eA\u003c/strong\u003e. The console joins your Wi-Fi, signs in with its own Jellyfin sign-in and opens\nthe library named ChromaTube: your channels, then each channel's videos (grouped by year, like seasons), then a\nvideo's page with \u003cstrong\u003ePlay\u003c/strong\u003e.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eD-pad\u003c/td\u003e\n\u003ctd\u003eMove\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOpen / Play\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBack; at the channels, back to the start-up menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSelect\u003c/strong\u003e (on the start-up menu's ChromaTube row)\u003c/td\u003e\n\u003ctd\u003eAsks \"Hide ChromaTube?\" (bring it back: Other firmware › Show hidden apps)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-root.png\" width=\"320\" alt=\"The channels (sample data)\"\u003e\n\u003cimg src=\"docs/images/chromatube-videos.png\" width=\"320\" alt=\"A channel\u0026#x27;s videos (sample data)\"\u003e\n\u003cimg src=\"docs/images/chromatube-details.png\" width=\"320\" alt=\"A video\u0026#x27;s page (sample data)\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-playing\"\u003ePlaying\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePlay\u003c/strong\u003e asks your server to prepare the video first (Jellyfin's PlaybackInfo), then plays it as one stream from the\nbeginning at up to 500 kbit/s and 15 pictures a second, with sound (console chip image 18.40 or 18.41). The first\npicture takes a few seconds: the server tool fetches the video's address first.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA\u003c/strong\u003e or \u003cstrong\u003eStart\u003c/strong\u003e pauses and plays; \u003cstrong\u003eSelect\u003c/strong\u003e, Up or Down show or hide the bar under the picture; \u003cstrong\u003eB\u003c/strong\u003e stops.\nLeft/Right and the Menu button do nothing during a ChromaTube video.\u003c/li\u003e\n\u003cli\u003eThere is \u003cstrong\u003eno seeking, no resume and no quality change\u003c/strong\u003e on ChromaTube videos: they always start from the\nbeginning. A dropped connection stops the video and says so.\u003c/li\u003e\n\u003cli\u003eJellyfin records what you watched, as for any video.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-the-screen-says\"\u003eWhat the screen says\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMessage\u003c/th\u003e\n\u003cth\u003eMeans\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eWi-Fi isn't set up yet\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eChromaTube needs Wi-Fi: \u003cstrong\u003eSelect\u003c/strong\u003e sets it up on the console, or use Chromatic Manager\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromaTube isn't set up on your server\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThere is no library named exactly \"ChromaTube\", or the console's user cannot see it (\u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo channels in ChromaTube yet\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe library is there but empty: add channels, wait for the tool's next run (new videos can take a few minutes), then refresh the library (\u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA video does not start\u003c/td\u003e\n\u003ctd\u003eThe server tool could not fetch it (see \u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e and \u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-not-set-up.png\" width=\"320\" alt=\"ChromaTube isn\u0026#x27;t set up on your server\"\u003e\n\u003cimg src=\"docs/images/chromatube-no-channels-yet.png\" width=\"320\" alt=\"No channels in ChromaTube yet\"\u003e\n\u003cimg src=\"docs/images/chromatube-not-set-up-no-wifi.png\" width=\"320\" alt=\"ChromaTube: Wi-Fi isn\u0026#x27;t set up yet\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePlay ChromaTube videos from the ChromaTube row.\u003c/strong\u003e The library also shows in the Jellyfin row, but a ChromaTube\nvideo opened there plays full size without sound (the Jellyfin row does not ask PlaybackInfo first).\u003c/li\u003e\n\u003cli\u003eThe Analogue Pocket (PocketFin) is not supported for ChromaTube videos.\u003c/li\u003e\n\u003cli\u003eOnly the channels in your list, at most 15 recent videos each; new videos appear after the tool's next run and\nJellyfin's next scan of the library.\u003c/li\u003e\n\u003cli\u003eLong titles are cut.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Updating.md",
"title":"Updating",
"html":"\u003ch1 id=\"h-updating\"\u003eUpdating\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Updating\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Updating.md:change-your-channels\"\u003eChange your channels\u003c/a\u003e · \u003ca href=\"#docs/Updating.md:change-a-setting\"\u003eChange a setting\u003c/a\u003e ·\n\u003ca href=\"#docs/Updating.md:update-the-server-tool\"\u003eUpdate the server tool\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-change-your-channels\"\u003eChange your channels\u003c/h2\u003e\n\u003cp\u003eThe settings files are mounted read-only, so the tool's page cannot change them. Edit \u003ccode\u003echannel_list.json\u003c/code\u003e on the\nDocker machine, then restart the container\n(\u003ccode\u003edocker compose -p chromatube restart\u003c/code\u003e) and start a run from the tool's page (or wait for the next one). Then\n\u003ccode\u003epy -3 tools\\chromatube_library.py refresh --yes --ask-admin\u003c/code\u003e. A removed channel's folder can be deleted by hand from\nthe ChromaTube folder.\u003c/p\u003e\n\u003ch2 id=\"h-change-a-setting\"\u003eChange a setting\u003c/h2\u003e\n\u003cp\u003eEdit the \u003ccode\u003e.json\u003c/code\u003e file, then \u003cstrong\u003erestart the container\u003c/strong\u003e (\u003ccode\u003edocker compose -p chromatube restart\u003c/code\u003e): the tool's own\n\"restart service\" button may not reload its settings. After changing \u003ccode\u003evideo_quality\u003c/code\u003e or the hand-over settings, also\nclear the tool's direct-stream cache (in its page, or \u003ccode\u003edocker compose -p chromatube down -v\u003c/code\u003e and \u003ccode\u003eup -d\u003c/code\u003e, which also\nempties its data volume; your channel list and the \u003ccode\u003e.strm\u003c/code\u003e folder are kept).\u003c/p\u003e\n\u003ch2 id=\"h-update-the-server-tool\"\u003eUpdate the server tool\u003c/h2\u003e\n\u003cp\u003eYouTube changes things now and then; then videos stop starting until a newer image of ytdlp2STRM (with a newer\nyt-dlp) is out. The image is \u003cstrong\u003epinned by digest\u003c/strong\u003e, so it never changes by itself.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat the pin is:\u003c/strong\u003e \u003ccode\u003esha256:2757a5e7293d7e885d5dc057b26a9e8cb9b5a5b2a6affe6a3e9f7f8c5fb9ec7c\u003c/code\u003e, the build the publisher\ntagged \u003ccode\u003elatest\u003c/code\u003e on 2026-10-25 (upstream commit 7d4a047). It is \u003cstrong\u003enot\u003c/strong\u003e a release tag: the newest release tags point at\nolder builds with other digests. If the publisher ever prunes untagged images, this digest may stop being pullable;\nthen choose a newer one as below. Keep a note of the digest you run, so you can go back.\u003c/p\u003e\n\u003cp\u003eTo move to a newer build on purpose:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLook at what changed: \u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003egithub.com/fe80Grau/ytdlp2STRM\u003c/a\u003e (commits and\nreleases).\u003c/li\u003e\n\u003cli\u003eOn the Docker machine, pull the build you chose (a release tag, or \u003ccode\u003elatest\u003c/code\u003e at that moment) and read its digest:\n\u003ccode\u003edocker pull fe80grau/ytdlp2strm:latest\u003c/code\u003e, then\n\u003ccode\u003edocker image inspect --format \"{{index .RepoDigests 0}}\" fe80grau/ytdlp2strm:latest\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ePut that \u003ccode\u003efe80grau/ytdlp2strm@sha256:...\u003c/code\u003e into \u003ccode\u003edocker-compose.yml\u003c/code\u003e in place of the old one (never the tag itself)\nand run \u003ccode\u003edocker compose -p chromatube up -d\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eCheck that the page still asks for its sign-in, then \u003ccode\u003epy -3 tools\\chromatube_library.py test\u003c/code\u003e should PASS again. If\nnot, put the old digest back.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eNever use a moving tag such as \u003ccode\u003elatest\u003c/code\u003e, and never add an automatic updater: an update is a new program on your\nserver and deserves a look first.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Security.md\"\u003eSecurity\u003c/a\u003e\u003c/p\u003e"
}
]
},
