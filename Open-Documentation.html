"name":"Safety",
"pages":[
{
"path":"docs/Security.md",
"title":"Security set-up",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Security\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Security.md:keep-it-on-your-home-network\"\u003eKeep it on your home network\u003c/a\u003e · \u003ca href=\"#docs/Security.md:the-container\"\u003eThe container\u003c/a\u003e ·\n\u003ca href=\"#docs/Security.md:the-tools-own-page\"\u003eThe tool's own page\u003c/a\u003e · \u003ca href=\"#docs/Security.md:sign-ins\"\u003eSign-ins\u003c/a\u003e · \u003ca href=\"#docs/Security.md:the-library-tools-rules\"\u003eThe library tool's rules\u003c/a\u003e ·\n\u003ca href=\"#docs/Security.md:checklist\"\u003eChecklist\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-keep-it-on-your-home-network\"\u003eKeep it on your home network\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eJellyfin stays off the internet\u003c/strong\u003e for ChromaTube: no port forward, no public reverse proxy. The console, the\ncontainer and the PC tools need it on your home network only.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe container's port 5005 stays off the internet\u003c/strong\u003e too: no port forward on your router. On the Docker machine's\nfirewall allow 5005 \u003cstrong\u003eonly from your Jellyfin server (required)\u003c/strong\u003e; allow your PC only while you run \u003cstrong\u003eCheck it\nanswers\u003c/strong\u003e or open the tool's page, then remove that rule. This firewall rule is the real protection\n(\u003ca href=\"#docs/Security.md:what-the-sign-in-does-not-cover\"\u003ewhat the sign-in does not cover\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eThe container listens only on the LAN address you put in \u003ccode\u003econfig.json\u003c/code\u003e (never \u003ccode\u003e0.0.0.0\u003c/code\u003e). Its video addresses\n(\u003ccode\u003e/youtube/...\u003c/code\u003e) need no sign-in, because Jellyfin must reach them; that is why it must not be reachable from\noutside.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-the-container\"\u003eThe container\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eImage pinned by \u003cstrong\u003esha256 digest\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eIt cannot change by itself; updates are your choice (\u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emem_limit: 1g\u003c/code\u003e, \u003ccode\u003ecpus: 1.5\u003c/code\u003e, \u003ccode\u003epids_limit: 256\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eIt cannot take over the machine\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eno-new-privileges\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo privilege escalation inside the container\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMounts: the one ChromaTube folder, its own data volume, its four settings files \u003cstrong\u003eread-only\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eNothing of Jellyfin's\u003c/strong\u003e (no configuration, no database, no media drives), no Docker socket; the tool cannot change its own settings or sign-in (edit the files on the Docker machine, then restart the container)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe page sign-in, \u003cstrong\u003erequired\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSee below\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo cookies, no YouTube account, no API key\u003c/strong\u003e (\u003ccode\u003ecookie_value\u003c/code\u003e empty)\u003c/td\u003e\n\u003ctd\u003eNothing of yours to leak; age-restricted videos simply do not play. Never add cookies: they would tie your Google account to an unofficial tool\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo Jellyfin key, Jellyfin link off (\u003ccode\u003ejellyfin_integration\u003c/code\u003e False)\u003c/td\u003e\n\u003ctd\u003eThe container cannot change your Jellyfin server at all; the library is refreshed by Jellyfin's own schedule or by \u003ccode\u003erefresh\u003c/code\u003e from your PC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e360p sources\u003c/td\u003e\n\u003ctd\u003eA light conversion on your server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLogs rotated (3 × 10 MB)\u003c/td\u003e\n\u003ctd\u003eThey cannot fill the disk\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003ccode\u003etools/tests/test_server_templates.py\u003c/code\u003e checks these settings in the templates.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDropping Linux capabilities\u003c/strong\u003e (\u003ccode\u003ecap_drop: [ALL]\u003c/code\u003e) is optional extra hardening that was \u003cstrong\u003enot tested\u003c/strong\u003e with this\nimage: without them the tool may be unable to read its settings or write its folder, so the template does not use it.\nAdd it yourself only if you test it on your own machine.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIf the tool cannot read its settings\u003c/strong\u003e (its log shows an error reading \u003ccode\u003econfig.json\u003c/code\u003e, or it stops right after\nstarting), check the file's owner and permissions on the Docker machine: \u003ccode\u003emake_server_config.py\u003c/code\u003e writes \u003ccode\u003econfig.json\u003c/code\u003e\nreadable by you only on macOS/Linux, which the container (running as root, with its normal capabilities) can still\nread.\u003c/p\u003e\n\u003ch2 id=\"h-the-tools-own-page\"\u003eThe tool's own page\u003c/h2\u003e\n\u003cp\u003eThe page on port 5005 can change the tool's settings. Without a sign-in, its settings pages are open to anyone who can\nreach the port. So the sign-in is \u003cstrong\u003erequired\u003c/strong\u003e: \u003ccode\u003eytdlp2strm_web_username\u003c/code\u003e and\n\u003ccode\u003eytdlp2strm_web_password\u003c/code\u003e in \u003ccode\u003econfig.json\u003c/code\u003e must both be set. Chromatic Manager's \u003cstrong\u003eSave files\u003c/strong\u003e and\n\u003ccode\u003etools/make_server_config.py\u003c/code\u003e each write a random user name and a long random password for you (the Manager keeps a\nprivate copy on your PC, never shows it, and its \u003cstrong\u003eCheck it answers\u003c/strong\u003e passes only when the page refuses a visitor without\nthe sign-in and answers with it) (\u003ca href=\"#docs/Server-setup.md:2-make-your-copy-of-the-files\"\u003eServer set-up\u003c/a\u003e); by hand, make up a long\npassword you use nowhere else.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe video addresses Jellyfin uses (\u003ccode\u003e/youtube/...\u003c/code\u003e) stay open, as they must: that is why the firewall rule is\nrequired too.\u003c/li\u003e\n\u003cli\u003eThe password is stored in \u003ccode\u003econfig.json\u003c/code\u003e on the Docker machine (and in your copy): keep the file private, never commit\nor share it. The repository ships only \u003ccode\u003econfig.example.json\u003c/code\u003e, and \u003ccode\u003e.gitignore\u003c/code\u003e keeps \u003ccode\u003econfig.json\u003c/code\u003e out of Git.\u003c/li\u003e\n\u003cli\u003eWith the settings mounted read-only, the page cannot change the sign-in or your channels.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"h-what-the-sign-in-does-not-cover\"\u003eWhat the sign-in does not cover\u003c/h3\u003e\n\u003cp\u003eIn the pinned version the sign-in protects the settings pages only. The tool's live command channel (Socket.IO, used\nby its page to run its own command line) has no sign-in and accepts connections from any web page, and it can start\nprograms inside the container. So anything that can reach port 5005, including a web page open in a browser on an\nallowed computer, could use it. \u003cstrong\u003eThe firewall rule is the real protection:\u003c/strong\u003e allow 5005 from your Jellyfin server\nonly; allow your PC only while you run \u003cstrong\u003eCheck it answers\u003c/strong\u003e or open the page, then remove that rule.\u003c/p\u003e\n\u003ch2 id=\"h-sign-ins\"\u003eSign-ins\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eThe console\u003c/strong\u003e keeps its own normal (non-administrator) Jellyfin sign-in, made with Quick Connect.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe administrator\u003c/strong\u003e is used only on the PC, only to add, refresh or remove the library: \u003ccode\u003e--ask-admin\u003c/code\u003e keeps the\nname and password in memory for that one run, signs in as a device made for that run, and signs that one session out\nat the end. Nothing is saved.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo other session or device is ever signed out.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-the-library-tools-rules\"\u003eThe library tool's rules\u003c/h2\u003e\n\u003cp\u003eEvery request that could change the server is checked against a short allow-list before it is sent; anything else is\nrefused unsent:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eCommand\u003c/th\u003e\n\u003cth\u003eChanging requests it may send\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003echeck\u003c/code\u003e, \u003ccode\u003estatus\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eadd --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOST /Library/VirtualFolders?name=ChromaTube\u003c/code\u003e (no server-wide scan)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erefresh --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOST /Items/{the ChromaTube library}/Refresh\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etest\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eopen one ChromaTube video (PlaybackInfo), stop its own conversion, close it\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eremove --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eDELETE /Library/VirtualFolders?name=ChromaTube\u003c/code\u003e, only when the name, id and folder match the record\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eany, with \u003ccode\u003e--ask-admin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eits own sign-in, and the sign-out of that one session\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eIt prints counts and PASS/FAIL lines, never an address, path, name, token or id. Its tests run every command against a\nfake server that holds other libraries, users and sessions.\u003c/p\u003e\n\u003ch2 id=\"h-checklist\"\u003eChecklist\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e[ ] Jellyfin and port 5005 are not forwarded on the router\u003c/li\u003e\n\u003cli\u003e[ ] Firewall: 5005 only from the Jellyfin server (required); the PC only temporarily, while you check it\u003c/li\u003e\n\u003cli\u003e[ ] \u003ccode\u003econfig.json\u003c/code\u003e: your LAN address; page user name and password set (required), the file kept private\u003c/li\u003e\n\u003cli\u003e[ ] \u003ccode\u003eyt_config.json\u003c/code\u003e: \u003ccode\u003ecookie_value\u003c/code\u003e empty, \u003ccode\u003ejellyfin_api_key\u003c/code\u003e empty\u003c/li\u003e\n\u003cli\u003e[ ] \u003ccode\u003edocker-compose.yml\u003c/code\u003e: an \u003ccode\u003e@sha256:\u003c/code\u003e digest, \u003ccode\u003eno-new-privileges\u003c/code\u003e, \u003ccode\u003e:ro\u003c/code\u003e settings mounts, unchanged limits\u003c/li\u003e\n\u003cli\u003e[ ] The console signs in as a normal user\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Undo-everything.md",
"title":"Undo everything",
"html":"\u003ch1 id=\"h-undo-everything\"\u003eUndo everything\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Undo everything\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Undo-everything.md:the-library\"\u003eThe library\u003c/a\u003e · \u003ca href=\"#docs/Undo-everything.md:the-server-tool\"\u003eThe server tool\u003c/a\u003e · \u003ca href=\"#docs/Undo-everything.md:on-the-pc\"\u003eOn the PC\u003c/a\u003e · \u003ca href=\"#docs/Undo-everything.md:on-the-console\"\u003eOn the console\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-the-library\"\u003eThe library\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py remove --ask-admin\npy -3 tools\\chromatube_library.py remove --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe first is a dry run. The second checks that the library on the server is still the one it recorded (name, id and\nfolder), removes only it, and proves every other library is unchanged. \u003cstrong\u003eIts files are not touched.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWith Chromatic Manager:\u003c/strong\u003e Settings › ChromaTube server › \u003cstrong\u003eRemove library\u003c/strong\u003e (it also finds a library this tool added,\nand this tool finds one the Manager added; a library added elsewhere is removed only when its folder is named ChromaTube\nand holds channel folders, after you confirm it is yours). \u003cstrong\u003eBy hand:\u003c/strong\u003e Jellyfin \u003cstrong\u003eDashboard › Libraries › ChromaTube › Remove\u003c/strong\u003e. Nothing else was changed by ChromaTube.\u003c/p\u003e\n\u003cp\u003eWhat stays in Jellyfin afterwards: lines in its activity log, and watch history rows for the removed videos inside\nits database (no longer shown anywhere once the items are gone).\u003c/p\u003e\n\u003ch2 id=\"h-the-server-tool\"\u003eThe server tool\u003c/h2\u003e\n\u003cp\u003eOn the Docker machine, in the \u003ccode\u003echromatube\u003c/code\u003e folder:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edocker compose -p chromatube down -v\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt stops and deletes the container and its data volume (or, in a NAS Docker app: the project \u003ccode\u003echromatube\u003c/code\u003e › Stop ›\nDelete). Then delete the \u003ccode\u003echromatube\u003c/code\u003e folder and the ChromaTube folder of \u003ccode\u003e.strm\u003c/code\u003e files. The Manager's private copy of the page\nsign-in (\u003ccode\u003echromatube-server-signin.json\u003c/code\u003e in its private folder) can be deleted too. Remove the firewall rule for\nport 5005 if you added one. Optionally delete the image: \u003ccode\u003edocker image rm fe80grau/ytdlp2strm@sha256:...\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-on-the-pc\"\u003eOn the PC\u003c/h2\u003e\n\u003cp\u003eDelete \u003ccode\u003e%LOCALAPPDATA%\\ChromaTube\u003c/code\u003e (on macOS/Linux \u003ccode\u003e~/.local/share/chromatube\u003c/code\u003e): the library record and backups. Then\ndelete the repository folder.\u003c/p\u003e\n\u003ch2 id=\"h-on-the-console\"\u003eOn the console\u003c/h2\u003e\n\u003cp\u003eTurn ChromaTube off in Chromatic Manager › \u003cstrong\u003eSettings › Apps\u003c/strong\u003e, or on the start-up menu highlight \u003cstrong\u003eChromaTube\u003c/strong\u003e, press\n\u003cstrong\u003eSelect\u003c/strong\u003e, then \u003cstrong\u003eA\u003c/strong\u003e (\"Hide ChromaTube?\"): the row disappears from the start-up menu. With no library named ChromaTube the row would only say \"ChromaTube is not set up on the\nserver\". To remove Jellymatic's start-up menu altogether, see the\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/blob/main/docs/Recovery.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic recovery guide\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Troubleshooting.md",
"title":"Troubleshooting",
"html":"\u003ch1 id=\"h-troubleshooting\"\u003eTroubleshooting\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Troubleshooting\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Troubleshooting.md:on-the-console\"\u003eOn the console\u003c/a\u003e · \u003ca href=\"#docs/Troubleshooting.md:the-server-tool\"\u003eThe server tool\u003c/a\u003e · \u003ca href=\"#docs/Troubleshooting.md:the-library-tool\"\u003eThe library tool\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-on-the-console\"\u003eOn the console\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromaTube isn't set up on your server\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAdd the library (\u003ca href=\"#docs/Add-the-library.md\"\u003eAdd the library\u003c/a\u003e); give the console's user access to it\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe row is missing from the start-up menu\u003c/td\u003e\n\u003ctd\u003eChromaTube is off on a new console: Chromatic Manager › Settings › Apps; if you hid it: Other firmware › Show hidden apps; or the start-up menu is older than 1.6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo channels in the library\u003c/td\u003e\n\u003ctd\u003eThe tool has not run yet, or the library was not refreshed: \u003ccode\u003erefresh --yes\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA video does not start\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epy -3 tools\\chromatube_library.py test\u003c/code\u003e; if it fails, see the server tool below\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePicture full size, no sound\u003c/td\u003e\n\u003ctd\u003eYou opened it from the \u003cstrong\u003eJellyfin\u003c/strong\u003e row: open ChromaTube videos from the \u003cstrong\u003eChromaTube\u003c/strong\u003e row\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo sound in any video\u003c/td\u003e\n\u003ctd\u003eSound needs Jellymatic's console chip image 18.40 or 18.41\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIt stops after a while\u003c/td\u003e\n\u003ctd\u003eWi-Fi dropped or the server is busy; videos always start again from the beginning\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-the-server-tool\"\u003eThe server tool\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eIts page asks for a user name and password\u003c/td\u003e\n\u003ctd\u003eThat is the required sign-in: the values are in \u003ccode\u003econfig.json\u003c/code\u003e on the Docker machine (or in your copy)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA change made in its page does not stick\u003c/td\u003e\n\u003ctd\u003eThe settings files are read-only on purpose: edit them on the Docker machine, then \u003ccode\u003edocker compose -p chromatube restart\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe container does not start\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocker logs chromatube-ytdlp2strm\u003c/code\u003e; check that \u003ccode\u003econfig.json\u003c/code\u003e, \u003ccode\u003echannel_list.json\u003c/code\u003e and \u003ccode\u003e.env\u003c/code\u003e exist next to \u003ccode\u003edocker-compose.yml\u003c/code\u003e (a missing file makes Docker create an empty folder in its place); if the log says it cannot read \u003ccode\u003econfig.json\u003c/code\u003e, check that file's owner and permissions on the Docker machine\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIts page does not open\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eytdlp2strm_host\u003c/code\u003e must be the Docker machine's LAN address and the compose file must use host networking; check the firewall rule for 5005 (from your PC it opens only while the temporary rule for your PC is in place)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe ChromaTube folder stays empty\u003c/td\u003e\n\u003ctd\u003eStart a run from its page; check \u003ccode\u003echannel_list.json\u003c/code\u003e (valid JSON, real channel addresses); look at its log on the page\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVideos list, but none plays\u003c/td\u003e\n\u003ctd\u003eYouTube may have changed something: \u003ca href=\"#docs/Updating.md:update-the-server-tool\"\u003eupdate the tool\u003c/a\u003e. After a settings change, restart the container (its own restart button may not reload settings)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVideos play without sound, or huge\u003c/td\u003e\n\u003ctd\u003eKeep \u003ccode\u003evideo_quality\u003c/code\u003e \"360\" and \u003ccode\u003edirect_serve_media_playlist\u003c/code\u003e \"False\", restart the container and clear its direct-stream cache (\u003ca href=\"#docs/Updating.md:change-a-setting\"\u003eUpdating\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn age-restricted video never plays\u003c/td\u003e\n\u003ctd\u003eExpected: they need cookies, and ChromaTube never uses cookies\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-the-library-tool\"\u003eThe library tool\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMessage\u003c/th\u003e\n\u003cth\u003eMeans\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethe server cannot see the folder\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe path is the one your PC or Docker machine sees, not Jellyfin's; or the folder is not mounted into the Jellyfin container\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethe folder is inside (or contains) an existing library folder\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eChoose a folder of its own, outside every library\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ea library named ChromaTube already exists\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRemove it first (by hand if it was not made by this tool)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethe ChromaTube library on the server is not the one recorded\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eIt was changed or re-made by hand since; \u003ccode\u003eremove\u003c/code\u003e will not touch it. Remove it by hand if you want it gone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFAIL no saved Jellyfin settings found\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUse \u003ccode\u003e--ask-admin\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/FAQ.md",
"title":"FAQ",
"html":"\u003ch1 id=\"h-faq\"\u003eFAQ\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › FAQ\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs this made by YouTube, Google, ModRetro, Analogue or Jellyfin?\u003c/strong\u003e No. ChromaTube is an independent project, not\naffiliated with or endorsed by any of them. YouTube is a trademark of Google LLC.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs it allowed by YouTube?\u003c/strong\u003e No: tools that reach videos outside YouTube's own apps conflict with its Terms of\nService, and the Chromatic cannot show YouTube's official player. Setting it up is your own choice for private use\n(\u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy does it need my Jellyfin server?\u003c/strong\u003e The console cannot decode YouTube's video (H.264, VP9, AV1). Jellyfin\nconverts each video into the small MJPEG picture and ADPCM sound the console plays, exactly as for films.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it download videos?\u003c/strong\u003e No. Only tiny \u003ccode\u003e.strm\u003c/code\u003e entries are written; a video is fetched while it plays.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I search all of YouTube?\u003c/strong\u003e No. Only the channels in your list, their newest videos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDo I need a Google account, cookies or an API key?\u003c/strong\u003e No, and never add them.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it change my Jellyfin server?\u003c/strong\u003e One library is added (with a backup, a dry run and proof that nothing else\nchanged). The container cannot change Jellyfin at all: it has no key and none of Jellyfin's files.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWill the library show in my other Jellyfin apps?\u003c/strong\u003e Yes, like any library, for users who may see it. You can hide it\nper user in Jellyfin.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy can't I seek?\u003c/strong\u003e Seeking in these remote videos is not proven on the console, so ChromaTube plays one stream\nfrom the beginning.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIt worked yesterday and today nothing plays.\u003c/strong\u003e YouTube changes things now and then; see \u003ca href=\"#docs/Updating.md\"\u003eUpdating\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it work on the Analogue Pocket?\u003c/strong\u003e Not supported.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat does it cost?\u003c/strong\u003e Nothing. A few KB of disk per video listed, and one light conversion while you watch.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Building-and-testing.md\"\u003eBuilding and testing\u003c/a\u003e\u003c/p\u003e"
}
]

"html":"\u003ch1 id=\"h-building-and-testing\"\u003eBuilding and testing\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Building and testing\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Building-and-testing.md:where-the-code-is\"\u003eWhere the code is\u003c/a\u003e · \u003ca href=\"#docs/Building-and-testing.md:tests\"\u003eTests\u003c/a\u003e · \u003ca href=\"#docs/Building-and-testing.md:documentation\"\u003eDocumentation\u003c/a\u003e ·\n\u003ca href=\"#docs/Building-and-testing.md:rules-for-changes\"\u003eRules for changes\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-where-the-code-is\"\u003eWhere the code is\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe server set-up\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eserver/\u003c/code\u003e here: the Docker Compose file and the tool's settings templates (\u003ccode\u003econfig.example.json\u003c/code\u003e, never a filled-in \u003ccode\u003econfig.json\u003c/code\u003e); \u003ccode\u003etools/make_server_config.py\u003c/code\u003e makes your own copy with a random page sign-in\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe library tool\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003etools/chromatube_library.py\u003c/code\u003e here, with \u003ccode\u003ejellyfin_admin.py\u003c/code\u003e, the small careful Jellyfin client it shares with Chromavision's tools\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe ChromaTube row on the console (library browser, PlaybackInfo-first playback)\u003c/td\u003e\n\u003ctd\u003eJellymatic: \u003ccode\u003echromatic/jellyfin/\u003c/code\u003e (the Jellyfin app in its ChromaTube mode) and \u003ccode\u003echromatic/launcher/\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Apps switches\u003c/td\u003e\n\u003ctd\u003eJellymatic: Chromatic Manager and the start-up menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe row's icon\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eart/chromatube-icon-12.png\u003c/code\u003e here: a stack of three violet video cards, the same pixels as the console's (drawn by Jellymatic's \u003ccode\u003escripts/build_app_icons.py\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eytdlp2STRM and yt-dlp\u003c/td\u003e\n\u003ctd\u003eNot here: Docker downloads the pinned image (\u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003efe80Grau/ytdlp2STRM\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-tests\"\u003eTests\u003c/h2\u003e\n\u003cp\u003eStandard library only; no Docker, no device, no internet (the fake Jellyfin server listens on 127.0.0.1):\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\tests\\test_chromatube_library.py\npy -3 tools\\tests\\test_server_templates.py\npy -3 tools\\tests\\test_private_files.py\npy -3 scripts\\test_docs_html.py\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003etest_chromatube_library.py\u003c/code\u003e runs every command against a fake server that already holds other libraries, users and\nsessions, with failures injected (add refused, delete fails, no videos, a library replaced by hand, a folder inside\nanother library, a folder the server cannot see). It checks that only allow-listed requests are sent, every other\nlibrary stays byte for byte the same, nothing private is printed and only the run's own session is signed out.\n\u003ccode\u003etest_server_templates.py\u003c/code\u003e checks the safety settings of the files in \u003ccode\u003eserver/\u003c/code\u003e (pinned digest, required sign-in,\nread-only settings, no privilege escalation, no cookies or keys; Security.md still explains what the sign-in does not cover) and \u003ccode\u003emake_server_config.py\u003c/code\u003e (random sign-in, LAN addresses\nonly, never inside the repository, never printed). \u003ccode\u003etest_private_files.py\u003c/code\u003e checks that backups are user-only on\nmacOS/Linux.\u003c/p\u003e\n\u003ch2 id=\"h-documentation\"\u003eDocumentation\u003c/h2\u003e\n\u003cp\u003eAfter editing any page: \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e, then \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e (needs Chrome or\nEdge), then \u003ccode\u003epy -3 scripts\\test_docs_html.py\u003c/code\u003e. GitHub Pages: Settings › Pages, branch \u003ccode\u003emain\u003c/code\u003e, folder \u003ccode\u003e/docs\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-rules-for-changes\"\u003eRules for changes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the rules of \u003ca href=\"#docs/Security.md\"\u003eSecurity\u003c/a\u003e: add-only, backup, dry run, proof, allow-listed requests, nothing private\nprinted, never sign out another session; a pinned digest; no cookies, keys or accounts in templates.\u003c/li\u003e\n\u003cli\u003eNever add channel lists, videos or anything personal.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/p\u003e"
},

"html":"\u003ch1 id=\"h-credits--licences\"\u003eCredits \u0026amp; licences\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Credits \u0026amp; licences\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Credits-and-licences.md:author\"\u003eAuthor\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:this-projects-licence\"\u003eThis project's licence\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:used-not-included\"\u003eUsed, not included\u003c/a\u003e ·\n\u003ca href=\"#docs/Credits-and-licences.md:included-here\"\u003eIncluded here\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:trademarks\"\u003eTrademarks\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-author\"\u003eAuthor\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Under GPLv3 section 7(b), redistributions and modified versions must keep this\nattribution in the README credits and in any About or credits screen (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-this-projects-licence\"\u003eThis project's licence\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e) for everything written for ChromaTube: the library tool, the server\ntemplates, the docs, the build scripts and the icon. \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e adds the\nattribution term (7(b)) and the marking of modified versions (7(c)), as in Jellymatic. The console code is part of\nJellymatic, under Jellymatic's licence and additional terms.\u003c/p\u003e\n\u003ch2 id=\"h-used-not-included\"\u003eUsed, not included\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eHow it is used\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eytdlp2STRM\u003c/a\u003e, Copyright (c) 2024 fe80grau\u003c/td\u003e\n\u003ctd\u003eMIT\u003c/td\u003e\n\u003ctd\u003eThe Docker image \u003ccode\u003efe80grau/ytdlp2strm\u003c/code\u003e, pinned by digest in \u003ccode\u003eserver/docker-compose.yml\u003c/code\u003e, downloaded by Docker from Docker Hub. Not included or modified; the settings templates here are ChromaTube's own\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"https://github.com/yt-dlp/yt-dlp\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eyt-dlp\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe Unlicense\u003c/td\u003e\n\u003ctd\u003eInside that image\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin server and its FFmpeg-based conversion\u003c/td\u003e\n\u003ctd\u003eGPL-2.0; the Jellyfin logo is CC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003eThrough its public web API; no Jellyfin code or logo here\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDocker / Docker Compose\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003eRuns the container\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePython\u003c/td\u003e\n\u003ctd\u003ePSF licence\u003c/td\u003e\n\u003ctd\u003eRuns the tools\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellymatic\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later with its additional terms\u003c/td\u003e\n\u003ctd\u003eThe start-up menu with the ChromaTube row\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe videos belong to their creators. ChromaTube stores none.\u003c/p\u003e\n\u003ch2 id=\"h-included-here\"\u003eIncluded here\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P font (CodeMan38)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1, \u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen font (The Silkscreen Project Authors)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1, \u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eYouTube is a trademark of Google LLC. ModRetro and Chromatic are trademarks of ModRetro, Inc. Analogue and Pocket are\ntrademarks of Analogue. Jellyfin is a trademark of its owners. They are used only to say what ChromaTube works with. ChromaTube is an independent project, not\naffiliated with, endorsed or supported by any of them. The ChromaTube icon is original art and uses no YouTube logo.\u003c/p\u003e"

{
"path":"CONTRIBUTING.md",
"title":"Contributing",
"html":"\u003ch1 id=\"h-contributing-to-chromatube\"\u003eContributing to ChromaTube\u003c/h1\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome. This is a hobby project: there is no guarantee of a response\nor a fix, but every report is read when time allows.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eOpen an issue with what you did, what you expected and what happened; the start-up menu version, the Jellyfin server\nversion, the pinned image digest in your \u003ccode\u003edocker-compose.yml\u003c/code\u003e, and the library tool's PASS/FAIL lines (they hold no\nprivate details). Never post server addresses, tokens, your channel list or \u003ccode\u003econfig.json\u003c/code\u003e. Security problems:\n\u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Problems with the console's ChromaTube screens belong to\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e; problems of ytdlp2STRM itself to\n\u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eits project\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-pull-requests\"\u003ePull requests\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the rules of \u003ca href=\"#docs/Security.md\"\u003edocs/Security.md\u003c/a\u003e: add-only, backup, dry run, proof, allow-listed requests,\nnothing private printed, never sign out another session or device; a pinned digest; no cookies, keys or accounts.\u003c/li\u003e\n\u003cli\u003eNever add channel lists or videos to the repository.\u003c/li\u003e\n\u003cli\u003eRun the tests (\u003ccode\u003etools/tests/\u003c/code\u003e, \u003ccode\u003escripts/test_docs_html.py\u003c/code\u003e) and say which ones you ran. Tests must never contact a\nreal server, Docker or a device.\u003c/li\u003e\n\u003cli\u003eAfter editing any documentation page, run \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e and \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e;\n\u003ccode\u003escripts\\test_docs_html.py\u003c/code\u003e checks the results.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads.\u003c/li\u003e\n\u003cli\u003eBy contributing you agree that your contribution is licensed under GPL-3.0-or-later with the additional terms in\n\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"SECURITY.md",
"title":"Security",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003ch2 id=\"h-reporting-a-vulnerability\"\u003eReporting a vulnerability\u003c/h2\u003e\n\u003cp\u003ePlease report security problems \u003cstrong\u003eprivately\u003c/strong\u003e, not in a public issue: use GitHub's \u003cstrong\u003eSecurity › Report a\nvulnerability\u003c/strong\u003e (private vulnerability reporting) on this repository. Describe the problem, how to reproduce it and\nwhat it affects (the server templates, the library tool, the Jellyfin server, the console). There is no guarantee of a\nresponse time; reports are handled as time allows. Problems in ytdlp2STRM itself belong to\n\u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eits project\u003c/a\u003e; problems in the console code to\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-never-post-publicly\"\u003eNever post publicly\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eJellyfin server addresses, user names, user IDs, tokens, device IDs\u003c/li\u003e\n\u003cli\u003eYour Docker machine's address, \u003ccode\u003econfig.json\u003c/code\u003e with a page password, \u003ccode\u003e.env\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eYour channel list\u003c/li\u003e\n\u003cli\u003eThe files in your private folder (\u003ccode\u003e%LOCALAPPDATA%\\ChromaTube\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003eLogs or screenshots that show any of the above\u003c/li\u003e\n\u003cli\u003eNever any cookies: ChromaTube does not use them, and nobody should ask you for them\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-chromatube-does-to-protect-you\"\u003eWhat ChromaTube does to protect you\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe server tool runs with a pinned image, memory/CPU/process limits, no privilege escalation, only its own folder\nmounted, no cookies, no account, no API key and no Jellyfin key; it listens only on your LAN address.\u003c/li\u003e\n\u003cli\u003eThe library tool prints counts and PASS/FAIL lines only, checks every changing request against a short\nallow-list, follows no redirects, and signs out only its own one-run session.\u003c/li\u003e\n\u003cli\u003eAn administrator sign-in is typed for one run (\u003ccode\u003e--ask-admin\u003c/code\u003e), kept in memory and never saved.\u003c/li\u003e\n\u003cli\u003eKeep Jellyfin and port 5005 off the internet, and firewall 5005 to your Jellyfin server only (your PC only while you\ncheck it). The firewall is the real protection: in the pinned ytdlp2STRM the page sign-in guards only the settings\npages, not its command channel (\u003ca href=\"#docs/Security.md:what-the-sign-in-does-not-cover\"\u003edocs/Security.md\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e"
},

03c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eytdlp2STRM, Copyright (c) 2024 fe80grau\u003c/td\u003e\n\u003ctd\u003eMIT (\u003ca href=\"https://github.com/fe80Grau/ytdlp2STRM/blob/main/LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eits LICENSE\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eThe Docker image \u003ccode\u003efe80grau/ytdlp2strm\u003c/code\u003e, pinned by sha256 digest in \u003ccode\u003eserver/docker-compose.yml\u003c/code\u003e; Docker downloads it from Docker Hub. Its image contains its own dependencies (yt-dlp, Python, Flask and others) under their own licences\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eyt-dlp\u003c/td\u003e\n\u003ctd\u003eThe Unlicense (\u003ca href=\"https://github.com/yt-dlp/yt-dlp/blob/master/LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eits LICENSE\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eInside that image\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin server\u003c/td\u003e\n\u003ctd\u003eGPL-2.0; the Jellyfin logo CC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003eUsed through its public web API; no Jellyfin code or logo here\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eYouTube's terms.\u003c/strong\u003e ytdlp2STRM and yt-dlp reach videos outside YouTube's own apps and player, which conflicts with\nYouTube's Terms of Service. ChromaTube contains neither; whether to run them is the user's choice\n(\u003ca href=\"#docs/Before-you-start.md\"\u003edocs/Before-you-start.md\u003c/a\u003e). The videos belong to their creators.\u003c/p\u003e\n\u003ch2 id=\"h-in-jellymatics-start-up-menu-not-included-here\"\u003eIn Jellymatic's start-up menu (not included here)\u003c/h2\u003e\n\u003cp\u003eThe ChromaTube row is part of Jellymatic's start-up menu; its firmware components (ESP-IDF and others) and their\nnotices are listed in Jellymatic's THIRD-PARTY-NOTICES.md.\u003c/p\u003e"
},

overed by Jellymatic's\nlicence and additional terms (including its additional permissions for Espressif's binary-only libraries and the\nESP32 ROM), not by this file.\u003c/p\u003e\n\u003cp\u003eYou may remove these additional terms from your own copy or modified version only as GPLv3 section 7 allows. They do\nnot grant any permission to use a name or trademark beyond the attribution above.\u003c/p\u003e"

<script>
(function () {
  var data = JSON.parse(document.getElementById('docs-data').textContent);
  var pages = {}, order = [];
  data.groups.forEach(function (g) { g.pages.forEach(function (p) { p.group = g.name; pages[p.path] = p; order.push(p.path); }); });
  var current = null;
  function el(id) { return document.getElementById(id); }
  function link(text, hash, cls) {
    var a = document.createElement('a'); a.textContent = text; a.href = '#' + hash; if (cls) a.className = cls; return a;
  }
  function parse() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    var cut = h.indexOf(':'), path = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? '' : h.slice(cut + 1);
    if (!pages[path]) { path = order[0]; anchor = ''; }
    return { path: path, anchor: anchor };
  }
  function nav(page) {
    var tabs = el('tabs'), list = el('pages');
    tabs.textContent = ''; list.textContent = '';
    data.groups.forEach(function (g) {
      tabs.appendChild(link(g.name, g.pages[0].path, g.name === page.group ? 'on' : ''));
      if (data.theme === 'chroma' && g.name !== page.group) return;
      var head = document.createElement('div'); head.className = 'group'; head.textContent = g.name; list.appendChild(head);
      g.pages.forEach(function (p) { list.appendChild(link(p.title, p.path, p.path === page.path ? 'on' : '')); });
    });
  }
  function show() {
    var where = parse(), page = pages[where.path];
    if (current !== page) {
      el('page').innerHTML = page.html;
      el('title').textContent = page.title;
      el('crumb').textContent = data.project + ' / ' + page.path;
      document.title = page.title + ' \u00b7 ' + data.project + ' documentation';
      nav(page);
      current = page;
    }
    var target = where.anchor && document.getElementById('h-' + where.anchor.toLowerCase());
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
